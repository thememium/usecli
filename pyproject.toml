[project]
name = "usecli"
version = "0.2.13"
description = "A powerful Python CLI framework for building beautiful, developer-friendly command-line tools."
readme = "README.md"
authors = [{ name = "Edward Boswell", email = "thememium@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
dependencies = [
  "case-converter>=1.2.0",
  "click>=8.5.1",
  "jinja2>=3.1.6",
  "prompt-toolkit>=3.0.53",
  "rich>=15.0.0",
  "simple-term-menu>=1.6.6",
  "typer>=0.29.3",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
figlet = ["pyfiglet>=1.0.4"]
pyinstaller = ["pyinstaller>=6.22.3"]

[project.urls]
Homepage = "https://github.com/thememium/usecli"
Documentation = "https://github.com/thememium/usecli"
Repository = "https://github.com/thememium/usecli.git"
Issues = "https://github.com/thememium/usecli/issues"
Changelog = "https://github.com/thememium/usecli/blob/master/CHANGELOG.md"

[project.scripts]
usecli = "usecli:main"
usecli-bundle = "usecli.bundler:cli"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "isort>=9.0.2",
  "poethepoet>=0.49.0",
  "pyfiglet>=1.0.4",
  "pyinstaller>=6.22.3",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist[psutil]>=3.8.0",
  "ruff>=0.17.6",
  "ty>=0.0.112",
]

[tool.deptry]
known_first_party = ["usecli"]

[tool.deptry.package_module_name_map]
case-converter = "caseconverter"

[tool.poe.tasks]
dev-interactive = { cmd = "uv run usecli -i", use_exec = true }
dev = "uv run usecli"
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
clean = "sh -c 'uv run isort . && uv run ruff format .'"
# xdist `-n auto` pins every core at 100%, which ramps the fans on long runs.
# PYTEST_XDIST_AUTO_NUM_WORKERS caps `auto` at half the online CPUs; override
# per run, e.g. PYTEST_XDIST_AUTO_NUM_WORKERS=4 uv run poe test.
test = "sh -c 'PYTEST_XDIST_AUTO_NUM_WORKERS=$(( ($(getconf _NPROCESSORS_ONLN) + 1) / 2 )) uv run pytest tests/ -n auto --dist worksteal -v $@' --"
test-cov = "sh -c 'PYTEST_XDIST_AUTO_NUM_WORKERS=$(( ($(getconf _NPROCESSORS_ONLN) + 1) / 2 )) uv run pytest tests/ -n auto --dist worksteal -v --cov=usecli --cov-report=term-missing $@' --"
sort = "uv run isort ."
lint = "uv run ruff check ."
format = "uv run ruff format ."
deptry = "uv run deptry ."
typecheck = "uv run ty check"
build = "uv build --no-sources"
release = "bash scripts/release.sh"

[tool.coverage.report]
fail_under = 100

[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.ty.rules]
# Ty uses rule = "level" format (error, warn, ignore)
# See all rules at: https://docs.astral.sh/ty/reference/rules/

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.setuptools.package-data]
cli = ["**/*.toml", "**/*.j2"]
