[colors]
# Core semantic colors
primary = "#7287fd"
secondary = "#40a02b"
accent = "#fe640b"

success = "#40a02b" # Green
error = "#d20f39"   # Red
warning = "#df8e1d" # Yellow
info = "#04a5e5"    # Teal / Blue

# Text
foreground = "#4c4f69"       # Text
foreground_muted = "#6c6f85" # Subtext

# Surfaces
background = "#eff1f5"   # Base
border = "#ccd0da"       # Surface
border_focus = "#40a02b" # Focus Ring

# UI semantics
command = "#7287fd"
option = "#7287fd"
link = "#7287fd"
prompt = "#40a02b"

panel_primary = "#40a02b"
panel_secondary = "#7287fd"
panel_accent = "#fe640b"
