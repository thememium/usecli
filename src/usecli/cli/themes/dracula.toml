[colors]
# Core semantic colors
primary = "#bd93f9"
secondary = "#50fa7b"
accent = "#ffb86c"

success = "#50fa7b" # Green
error = "#ff5555"   # Red
warning = "#f1fa8c" # Yellow
info = "#8be9fd"    # Teal / Blue

# Text
foreground = "#f8f8f2"       # Text
foreground_muted = "#6272a4" # Subtext

# Surfaces
background = "#282a36"   # Base
border = "#44475a"       # Surface
border_focus = "#50fa7b" # Focus Ring

# UI semantics
command = "#bd93f9"
option = "#bd93f9"
link = "#bd93f9"
prompt = "#50fa7b"

panel_primary = "#50fa7b"
panel_secondary = "#bd93f9"
panel_accent = "#ffb86c"
