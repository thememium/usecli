[colors]
# Core semantic colors
primary = "#88c0d0"
secondary = "#a3be8c"
accent = "#ebcb8b"

success = "#a3be8c" # Green
error = "#bf616a"   # Red
warning = "#ebcb8b" # Yellow
info = "#81a1c1"    # Teal / Blue

# Text
foreground = "#eceff4"       # Text
foreground_muted = "#d8dee9" # Subtext

# Surfaces
background = "#2e3440"   # Base
border = "#3b4252"       # Surface
border_focus = "#a3be8c" # Focus Ring

# UI semantics
command = "#88c0d0"
option = "#88c0d0"
link = "#88c0d0"
prompt = "#a3be8c"

panel_primary = "#a3be8c"
panel_secondary = "#88c0d0"
panel_accent = "#ebcb8b"
