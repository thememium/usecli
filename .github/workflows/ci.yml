name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # sdk/ is gitignored, so regenerate the Dagger SDK client before checks.
      - name: Regenerate Dagger SDK clients
        uses: dagger/dagger-for-github@v6
        with:
          version: "v1.0.0-beta.14"
          verb: generate
          args: -y

      - name: Run Dagger checks
        uses: dagger/dagger-for-github@v6
        with:
          version: "v1.0.0-beta.14"
          verb: check
